services:
  postgres:
    image: postgres:16-alpine
    container_name: avalliar-postgres
    environment:
      POSTGRES_DB: avalliar
      POSTGRES_USER: avalliar
      POSTGRES_PASSWORD: avalliar
    ports:
      - "5433:5432"
    volumes:
      - avalliar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalliar -d avalliar"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: avalliar-ml
    environment:
      # Fontes de busca do VivaReal (docs/07): preencha no .env da raiz do repo.
      VIVAREAL_RELAY: ${VIVAREAL_RELAY:-}
      VIVAREAL_RELAY_KEY: ${VIVAREAL_RELAY_KEY:-}
      VIVAREAL_PROXY: ${VIVAREAL_PROXY:-}
      VIVAREAL_SCRAPIANT: ${VIVAREAL_SCRAPIANT:-}
    ports:
      - "8000:8000"

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: avalliar-api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: avalliar
      DB_USER: avalliar
      DB_PASSWORD: avalliar
      ML_URL: http://ml:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  avalliar_pgdata:
