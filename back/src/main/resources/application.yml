spring:
  application:
    name: avalliar-api
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avalliar}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:avalliar}
    password: ${DB_PASSWORD:avalliar}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:avalliar-api-jwt-secret-key-2026-muito-segura-trocar-em-producao-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ml:
    url: ${ML_URL:http://localhost:8000}
  fotos:
    # Pasta das fotos da vistoria. Em produção é o Azure Files montado no Container App.
    diretorio: ${FOTOS_DIRETORIO:./data/fotos}
    azure:
      # Connection string da conta avalliarfotos26 (secret do Container App). Vazio = pasta local.
      connection-string: ${FOTOS_AZURE_CONNECTION_STRING:}
      share: ${FOTOS_AZURE_SHARE:fotos}
  gmail:
    # OAuth do Google Cloud (escopo gmail.readonly). Sem as três, a captação fica desligada.
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    monitorar: ${GMAIL_MONITORAR:false}
    intervalo-ms: ${GMAIL_INTERVALO_MS:60000}
    busca: ${GMAIL_BUSCA:in:inbox newer_than:7d}
    maximo-por-ciclo: ${GMAIL_MAXIMO_POR_CICLO:50}
    api-url: ${GMAIL_API_URL:https://gmail.googleapis.com/gmail/v1/users/me}
    token-url: ${GMAIL_TOKEN_URL:https://oauth2.googleapis.com/token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
